<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chatbox</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

  <!-- Logged out -->
  <section id="auth" class="auth hidden">
    <form id="auth-form" class="card">
      <h1>Chatbox</h1>
      <p class="muted">REST API &middot; SQLite &middot; auth &middot; LLM</p>

      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required placeholder="you@example.com" />

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required minlength="8" placeholder="at least 8 characters" />

      <button class="primary" id="auth-submit" type="submit">Log in</button>
      <p class="error" id="auth-error"></p>
      <p class="muted small">
        <span id="auth-hint">No account yet?</span>
        <a href="#" id="auth-toggle">Create one</a>
      </p>
    </form>
  </section>

  <!-- Logged in -->
  <section id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand">Chatbox</div>
      <button class="new-chat" id="new-chat">+ New chat</button>
      <nav id="conversations" class="conversations"></nav>
      <div class="account">
        <span id="who" class="muted"></span>
        <button id="logout" class="ghost">Log out</button>
      </div>
    </aside>

    <main class="chat">
      <header class="chat-head">
        <h2 id="chat-title">New chat</h2>
        <span id="mode-badge" class="badge hidden">mock mode</span>
      </header>

      <div id="messages" class="messages"></div>

      <form id="composer" class="composer">
        <textarea id="input" rows="1" placeholder="Send a message…" autocomplete="off"></textarea>
        <button class="primary" id="send" type="submit">Send</button>
      </form>
    </main>
  </section>

  <script src="/app.js" defer></script>
</body>
</html>
